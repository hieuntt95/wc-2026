<div class="min-h-dvh">
  <header class="sticky top-0 z-30 bg-gradient-to-r from-wc-orange via-wc-pink to-wc-purple text-white shadow-lg">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2.5">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-white/20 backdrop-blur sm:h-11 sm:w-11">
          <img src="images/world-cup-trophy.svg" alt="" width="40" height="40"
            class="h-9 w-9 drop-shadow-lg sm:h-10 sm:w-10" aria-hidden="true" />
        </span>
        <span class="leading-tight">
          <span class="block text-base font-extrabold tracking-tight">WC 2026</span>
          <span class="block text-[11px] font-medium text-white/80">USA · Canada · Mexico</span>
          <span class="block text-[9px] font-semibold text-white/65 sm:text-[10px]">
            Developed by Hiếu Nguyễn
          </span>
        </span>
      </a>

      <div class="flex items-center gap-2">
        <a routerLink="/sync-data" class="inline-flex h-9 items-center gap-1.5 rounded-full bg-white/15 px-3 text-xs font-bold
                 transition hover:bg-white/25" aria-label="Mở trang sync dữ liệu">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 7v5h-5M4 17v-5h5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M18.5 9A7 7 0 006.8 5.8M5.5 15a7 7 0 0011.7 3.2" stroke-linecap="round" />
          </svg>
          <span class="hidden sm:inline">Sync data</span>
          <span class="sm:hidden">Sync</span>
        </a>

        <button type="button" (click)="toggleTheme()"
          class="grid h-9 w-9 place-items-center rounded-full bg-white/15 transition hover:bg-white/25"
          [attr.aria-label]="isDark() ? 'Chuyển sang nền sáng' : 'Chuyển sang nền tối'">
          @if (isDark()) {
          <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
            <path
              d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66 5.66 1.41 1.41M4.93 4.93l1.41 1.41m0 11.32-1.41 1.41M19.07 4.93l-1.41 1.41M12 7a5 5 0 100 10 5 5 0 000-10z"
              stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" />
          </svg>
          } @else {
          <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
          }
        </button>
      </div>
    </div>

    <!-- Desktop / tablet navigation -->
    <nav class="mx-auto hidden max-w-5xl gap-1 px-4 sm:flex">
      @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="border-white text-white"
        [routerLinkActiveOptions]="{ exact: false }"
        class="border-b-2 border-transparent px-4 py-2.5 text-sm font-semibold text-white/75 transition hover:text-white">
        {{ item.label }}
      </a>
      }
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 pb-28 pt-5 sm:pb-10">
    <router-outlet />
  </main>

  <!-- Mobile bottom navigation -->
  <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white/90 backdrop-blur
           sm:hidden dark:border-white/10 dark:bg-slate-900/90" style="padding-bottom: var(--safe-bottom)">
    <div class="mx-auto grid max-w-5xl grid-cols-3">
      @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="text-wc-pink" class="flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold text-slate-500
                 dark:text-slate-400">
        @switch (item.icon) {
        @case ('calendar') {
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
          <path d="M3 9h18M8 3v3m8-3v3" stroke-linecap="round" />
        </svg>
        }
        @case ('ball') {
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5l4 3-1.5 4.5h-5L8 11z" stroke-linejoin="round" />
        </svg>
        }
        @default {
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4.5" width="18" height="15" rx="2" />
          <path d="M3 9.5h18M3 14.5h18M9 4.5v15" stroke-linecap="round" />
        </svg>
        }
        }
        {{ item.label }}
      </a>
      }
    </div>
  </nav>
</div>
