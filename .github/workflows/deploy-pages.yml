name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            supabase: {
              url: '__SUPABASE_URL__',
              anonKey: '__SUPABASE_ANON_KEY__',
            },
          };
          EOF
          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" src/environments/environment.ts
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" src/environments/environment.ts

      - name: Build Angular app
        run: npm run build -- --base-href /wc-2026/

      - name: Create SPA fallback
        run: cp dist/wc-2026/browser/index.html dist/wc-2026/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wc-2026/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
